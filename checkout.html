<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Everest Mart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="page-header">
    <div class="page-header-inner">
        <div class="header-left">
            <button class="back-nav-btn" onclick="history.back()" title="Go back"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="logo" onclick="location.href='everest.html'"><div class="logo-icon"><i class="fa-solid fa-mountain"></i></div><span>Everest<span class="logo-accent">Mart</span></span></div>
        </div>
        <a href="everest.html" class="page-back-link"><i class="fa-solid fa-arrow-left"></i> Continue Shopping</a>
    </div>
</header>

<!-- ==================== CHECKOUT MAIN ==================== -->
<main class="page-main" id="checkoutMain">
    <h1 class="page-title animate-in"><i class="fa-solid fa-truck-fast"></i> Checkout</h1>
    <p class="page-subtitle">Complete your delivery and payment details below</p>

    <div class="checkout-grid">
        <div class="checkout-form-section">
            <h2><i class="fa-solid fa-user"></i> Shipping Information</h2>
            <div class="form-group"><label>Full Name</label><input type="text" id="shipName" placeholder="Enter your full name" required></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" id="shipPhone" maxlength="10" oninput="this.value=this.value.replace(/\D/g,'')" placeholder="98XXXXXXXX" required></div>
            <div class="form-group"><label>Delivery Address</label><input type="text" id="shipAddress" placeholder="Street, Landmark" required></div>
            <div class="form-group"><label>City</label><input type="text" id="shipCity" value="Kathmandu" required></div>
            <div class="form-group"><label>Payment Method</label>
                <select id="paymentMethod" onchange="onPaymentChange()">
                    <option value="cod">Cash on Delivery (COD)</option>
                    <option value="digital">eSewa / Khalti</option>
                    <option value="card">Credit / Debit Card</option>
                </select>
            </div>
            <div id="paymentSection"></div>
        </div>

        <div class="order-summary">
            <h2><i class="fa-solid fa-receipt"></i> Order Summary</h2>
            <div class="summary-items" id="summaryItems"></div>
            <div class="summary-totals">
                <div class="summary-row"><span>Subtotal</span><span id="summarySubtotal">Rs. 0</span></div>
                <div class="summary-row"><span>Shipping</span><span id="summaryShipping">Rs. 150</span></div>
                <div class="summary-row total"><span>Total</span><span id="summaryTotal">Rs. 0</span></div>
            </div>
        </div>
    </div>
</main>

<!-- ==================== TOAST ==================== -->
<div id="toast" class="toast"></div>

<script src="checkout.js"></script>
</body>
</html>
